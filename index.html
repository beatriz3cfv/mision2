<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hogwarts Characters - Async Odyssey</title>
  </head>
  <body>
    <header>
      <h1>Personajes de Harry Potter</h1>
      <div class="controls">
        <input
          type="text"
          id="search"
          placeholder="Busca por nombre o casa (Harry, Gryffindor...)"
          autocomplete="off"
          aria-label="Buscar personaje"
        />
        <button type="button" id="search-btn" data-action="search">Buscar</button>
      </div>
      <div id="house-filters" class="filters" aria-label="Filtrar por casa"></div>
    </header>

    <main id="app">
      <!-- Aquí se renderiza dinámicamente el contenido -->
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
